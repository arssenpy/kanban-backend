# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kanban-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` runs `prisma migrate deploy` before starting the server
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://kanban-mu-ten.vercel.app
